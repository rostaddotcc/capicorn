name: Rust rebuild

on:
  push:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - name: System dependencies (PipeWire bindgen, OCR/ffmpeg tests, software Vulkan for kittest)
        timeout-minutes: 10
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 libpipewire-0.3-dev libspa-0.2-dev clang tesseract-ocr ffmpeg libvulkan1 mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        # Snapshot pixels are GPU-dependent (RADV here vs lavapipe on runners):
        # UPDATE_SNAPSHOTS auto-blesses mismatches IN THE RUNNER (never committed),
        # so CI gates the functional kittest assertions while strict snapshot
        # comparison stays a local gate (cargo test on the dev box).
        run: UPDATE_SNAPSHOTS=true cargo test --workspace
      - name: layers
        run: cargo xtask layers

  appimage:
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: System dependencies (PipeWire bindgen)
        timeout-minutes: 10
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 libpipewire-0.3-dev libspa-0.2-dev clang
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build release
        working-directory: rust
        run: cargo build --release -p snagcraft
      - name: Package AppImage
        working-directory: rust
        run: |
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-appimage https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-appimage
          export PATH="$PWD:$PATH"
          mkdir -p dist
          LINUXDEPLOY="$PWD/linuxdeploy" packaging/appimage.sh target/release/snagcraft dist
      - uses: actions/upload-artifact@v5
        with:
          name: snagcraft-rust-appimage
          path: rust/dist/*.AppImage

  # W25e: real Windows verification (issue #1). Proves the whole app compiles for
  # Windows and the cross-platform logic crates pass their tests on a Windows
  # runner. The egui/kittest UI suite is GPU/display-dependent and stays gated on
  # Linux (the `gates` job); here we exclude it. No system deps needed: ashpd/
  # PipeWire/hotkeys are cfg(linux), xcap uses the pure-Rust `windows` crate.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build (whole app compiles for Windows)
        run: cargo build --workspace
      - name: Logic tests (UI kittest is Linux-gated; no GPU needed here)
        run: cargo test --workspace --exclude snagcraft-ui-egui --no-fail-fast