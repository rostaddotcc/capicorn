name: build

# Builds a Linux AppImage/.deb and a Windows NSIS installer.
# Trigger manually (workflow_dispatch) or on a version tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri + PipeWire build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libpipewire-0.3-dev libspa-0.2-dev
          # libspa-sys bindgen needs the GCC include dir for stdbool.h
          GCC_INC=$(ls -d /usr/lib/gcc/x86_64-linux-gnu/*/include | head -1)
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$GCC_INC" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build --bundles appimage,deb
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"

      - name: Thin AppImage (system WebKitGTK, ~4 MB)
        run: |
          SRC=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name 'Capicorn_*_amd64.AppImage' | head -1)
          ./scripts/thin-appimage.sh "$SRC" src-tauri/target/release/bundle/appimage

      - uses: actions/upload-artifact@v4
        with:
          name: capicorn-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile

      - name: Build Windows installer (NSIS + MSI)
        run: pnpm tauri build --bundles nsis,msi

      - uses: actions/upload-artifact@v4
        with:
          name: capicorn-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
