<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SnagCraft</title>
    <!-- trunk builds the cdylib and injects the wasm-bindgen glue. The crate
         name is hyphenated while cargo's library target is underscored, so the
         artifact is picked explicitly. -->
    <link data-trunk rel="rust" data-target-name="snagcraft_web" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #12141a;
        color: #e6e8ec;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      }

      /* eframe paints into the canvas, so it owns the whole viewport. */
      #snagcraft_canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        outline: none;
        touch-action: none;
        cursor: default;
      }

      /* Shown only until the wasm boots: it sits behind the (opaque) canvas. */
      .boot {
        position: absolute;
        inset: 0;
        z-index: -1;
        display: grid;
        place-items: center;
        pointer-events: none;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <canvas id="snagcraft_canvas"></canvas>
    <div class="boot">Loading SnagCraft…</div>
  </body>
</html>
