[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask", "probes/editor-spike", "probes/viewport-probe"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/rostaddotcc/snagcraft"

[workspace.dependencies]
egui = { version = "0.37", features = ["default_fonts"] }
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ab_glyph = "0.2"
rfd = "0.18"
arboard = { version = "3", features = ["wayland-data-control"] }
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
pipewire = { version = "0.10", features = ["v0_3_34"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
thiserror = "2"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "io-util", "io-std", "net", "sync"] }
ashpd = { version = "0.14", default-features = false, features = ["screenshot", "global_shortcuts", "screencast", "tokio"] }
xcap = "0.9"
clap = { version = "4", features = ["derive"] }
cargo_metadata = "0.19"
rmcp = { version = "3.10", features = ["server", "transport-io", "macros", "schemars"] }
getrandom = "0.3"
schemars = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window","Document","Element","HtmlCanvasElement","Blob","Url","HtmlAnchorElement","Navigator","Clipboard"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
