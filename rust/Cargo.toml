[workspace]
resolver = "3"
members = ["probes/editor-spike", "probes/viewport-probe"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/rostaddotcc/snagcraft"

[workspace.dependencies]
egui = "0.37"
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ab_glyph = "0.2"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1