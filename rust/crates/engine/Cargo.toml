[package]
name = "snagcraft-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
snagcraft-algo = { path = "../algo" }
snagcraft-doc = { path = "../doc" }
snagcraft-ops = { path = "../ops" }
snagcraft-compose = { path = "../compose" }
snagcraft-format = { path = "../format" }
snagcraft-io = { path = "../io", default-features = false }
snagcraft-capture = { path = "../capture", optional = true }
snagcraft-recording = { path = "../recording", optional = true }
snagcraft-geom = { path = "../geom" }
snagcraft-raster = { path = "../raster" }
snagcraft-color = { path = "../color" }
snagcraft-text = { path = "../text" }
ab_glyph.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
# `native` is the desktop default: portal capture, screen recording and the
# system clipboard all need a real platform backend, so those crates and the
# commands built on them only exist with this feature. `--no-default-features`
# is the web core: it compiles to wasm32 and exposes the document/edit/settings
# commands only.
default = ["native"]
native = ["snagcraft-capture", "snagcraft-recording", "snagcraft-io/native"]

[lints]
workspace = true
