[package]
name = "snagcraft-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# `cdylib` only: trunk builds exactly one wasm artifact per target, and an
# extra `rlib` made the asset pipeline see two candidates.
crate-type = ["cdylib"]

[dependencies]
snagcraft-engine = { path = "../../crates/engine", default-features = false }
snagcraft-ui-egui = { path = "../../crates/ui-egui", default-features = false }
eframe.workspace = true
egui.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["console"] }
js-sys.workspace = true
console_error_panic_hook.workspace = true
tracing.workspace = true

[lints]
workspace = true
